<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>TopRun Partner Login</title>
  <link rel="stylesheet" href="/partner-portal.css?v=20260917-bo-cuc">
</head>
<body data-page="login">
  <main class="partner-login-page">
    <form id="partner-login-form" class="login-panel">
      <p>TopRun Partner</p>
      <h1>Chào mừng đối tác</h1>
      <p class="login-intro">Đăng nhập để xem danh sách sản phẩm cần mua, xác nhận phiên mua và theo dõi công nợ.</p>
      <label>ID đăng nhập
        <input id="partner-login-id" autocomplete="username" required>
      </label>
      <label>Mật khẩu
        <input id="partner-login-password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit">Đăng nhập</button>
      <p id="message" class="message"></p>
    </form>
  </main>
  <script src="/partner-login.js?v=20260701-partner-security"></script>
</body>
</html>
